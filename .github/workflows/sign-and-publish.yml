name: Decompile and Push to Repo

on: 
  workflow_dispatch:

# إعطاء صلاحيات الكتابة للبوت حتى يتمكن من رفع الملفات للمستودع
permissions:
  contents: write 

jobs:
  decompile-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Environment & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk wget unzip apktool
          wget https://github.com/skylot/jadx/releases/download/v1.4.7/jadx-1.4.7.zip
          unzip jadx-1.4.7.zip -d jadx_tool

      - name: 3. Download Trading Bot APK
        run: |
          wget "https://github.com/ipa-black/app-attack/releases/download/raw-uploads/_.apk" -O bot.apk

      - name: 4. Extract Source Code (JADX)
        run: |
          # استخراج الأكواد البرمجية ووضعها في مجلد SourceCode في الجذر
          ./jadx_tool/bin/jadx -d SourceCode bot.apk || true

      - name: 5. Extract Resources (Apktool)
        run: |
          # استخراج الموارد والتصاميم ووضعها في مجلد Resources في الجذر
          apktool d bot.apk -o Resources || true

      - name: 6. Cleanup (Remove temporary files)
        run: |
          # حذف ملفات التطبيق وأدوات الفك حتى لا يتم رفعها للمستودع كملفات زائدة
          rm -rf jadx_tool bot.apk jadx-1.4.7.zip

      - name: 7. Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-decompiled Trading Bot APK and pushed to root" || echo "No changes to commit"
          git push
