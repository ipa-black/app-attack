name: Decompile Trading Bot APK

on: 
  workflow_dispatch:

jobs:
  decompile-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk wget unzip apktool zip
          wget https://github.com/skylot/jadx/releases/download/v1.4.7/jadx-1.4.7.zip
          unzip jadx-1.4.7.zip -d jadx

      - name: 2. Download Trading Bot APK
        run: |
          wget "https://github.com/ipa-black/app-attack/releases/download/raw-uploads/_.apk" -O bot.apk

      - name: 3. Extract Source Code (JADX)
        run: |
          ./jadx/bin/jadx -d SourceCode bot.apk || true

      - name: 4. Extract Resources (Apktool)
        run: |
          apktool d bot.apk -o Resources || true

      - name: 5. Compress Results
        run: |
          zip -r TradingBot_Extracted.zip SourceCode Resources

      - name: 6. Upload Results for Download
        uses: actions/upload-artifact@v4
        with:
          name: TradingBot_Files
          path: TradingBot_Extracted.zip
